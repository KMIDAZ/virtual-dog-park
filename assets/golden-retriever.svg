<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <title>Illustration of a Golden Retriever</title>
  <!-- Body fluffy -->
  <ellipse cx="70" cy="86" rx="40" ry="36" fill="#e8b264"/>
  <!-- Head -->
  <circle cx="70" cy="50" r="32" fill="#e8b264"/>
  <!-- Floppy ears fluffy -->
  <path d="M40 42 C24 32,20 60,36 74 C44 80,50 66,48 50 Z" fill="#d49848"/>
  <path d="M100 42 C116 32,120 60,104 74 C96 80,90 66,92 50 Z" fill="#d49848"/>
  <!-- Eyes -->
  <circle cx="56" cy="46" r="3.4" fill="#2b2018"/>
  <circle cx="84" cy="46" r="3.4" fill="#2b2018"/>
  <circle cx="57" cy="45" r="1.3" fill="#ffffff"/>
  <circle cx="85" cy="45" r="1.3" fill="#ffffff"/>
  <!-- Muzzle -->
  <ellipse cx="70" cy="60" rx="13" ry="9" fill="#f8ddbc"/>
  <!-- Nose -->
  <ellipse cx="70" cy="64" rx="5.5" ry="4" fill="#222222"/>
  <!-- Friendly smile -->
  <path d="M63 70 Q70 76 77 70" stroke="#222222" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- Chest fur -->
  <ellipse cx="70" cy="94" rx="20" ry="14" fill="#f8e2c4"/>
  <!-- Legs -->
  <rect x="42" y="108" width="15" height="18" rx="7.5" fill="#e8b264"/>
  <rect x="83" y="108" width="15" height="18" rx="7.5" fill="#e8b264"/>
  <!-- Fluffy tail curve -->
  <path d="M108 82 Q128 70 122 96" stroke="#d49848" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>